<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibRec | Next-Gen Book Recommendations</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>LibRec</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#">Browse Genres</a>
                <a href="#">My List</a>
            </nav>
        </div>
    </header>

    <div class="main-content">
        <!-- GLOBAL SEARCH BAR -->
        <div class="search-container">
            <div class="search-bar">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="descInput" placeholder="Search by Title, Author, or describe a vibe...">
                <div class="search-actions">
                    <button id="isbnToggle" title="Search by ISBN">
                        <i class="fas fa-barcode"></i>
                    </button>
                    <button class="primary-search-btn" onclick="search()">Search</button>
                </div>
            </div>
            <!-- ISBN Field (Hidden by default) -->
            <div id="isbnField" class="hidden-field">
                <input type="text" id="isbnInput" placeholder="Enter ISBN-10 or ISBN-13...">
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- HERO CARD (Featured or Top Match) -->
            <section class="hero-section">
                <h2 class="section-label">Featured Spotlight</h2>
                <div id="heroCard" class="hero-card">
                    <div class="hero-placeholder">Discover your next favorite book...</div>
                </div>
            </section>

            <!-- SECONDARY RESULTS (GRID) -->
            <section class="results-section">
                <h2 id="resultsLabel" class="section-label">Discover Something New</h2>
                <div id="results" class="book-grid">
                    <!-- Results injected here -->
                </div>
            </section>
        </div>

        <!-- RECOMMENDED SLIDER -->
        <section class="recommendations-row">
            <h2 class="section-label">Recommended for You</h2>
            <div id="recommendations" class="horizontal-scroll">
                <!-- Random suggestions injected here -->
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 LibRec Intelligent Discovery Engine</p>
    </footer>

    <script src="/static/script.js"></script>
</body>

</html>
