<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ardent Library | Intelligent Book Discovery</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="main-container">
        <!-- HERO -->
        <header class="hero-section">
            <h1 class="headline">Explore Your Next Chapters.</h1>
            <p class="subheadline">An intelligent recommendation engine powered by semantic AI to help you find the perfect read based on your curiosity.</p>
        </header>

        <!-- SEARCH -->
        <main class="search-card">
            <nav class="tabs">
                <div id="descTab" class="tab active" onclick="switchTab('desc')">Semantic Search</div>
                <div id="isbnTab" class="tab" onclick="switchTab('isbn')">Exact ISBN</div>
            </nav>

            <div class="input-group">
                <!-- Description Field (default) -->
                <textarea id="descInput" 
                    placeholder="E.g., 'A thriller set in Victorian London with a focus on forensic science' or 'Beginner guides to machine learning'"></textarea>
                
                <!-- ISBN Field (hidden by default via JS class logic) -->
                <input id="isbnInput" type="text" placeholder="Enter 10 or 13-digit ISBN..." style="display: none;">
            </div>

            <button class="search-button" onclick="search()">Find Matches</button>
        </main>

        <!-- RESULTS SECTION -->
        <section class="content-section">
            <h2 id="sectionTitle" class="section-title">Suggested for You</h2>
            <div id="results" class="book-list">
                <!-- Cards injected here -->
                <div class="no-results">Initializing your library...</div>
            </div>
        </section>

        <footer style="margin-top: 8rem; text-align: center; color: var(--text-secondary); padding-bottom: 2rem;">
            &copy; 2026 Ardent Library | Built with Semantic AI
        </footer>
    </div>

    <!-- Logic -->
    <script src="/static/script.js"></script>
</body>
</html>
